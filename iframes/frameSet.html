<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout Example</title>
</head>
<frameset rows="100px,*">
    <!-- Top frame: Navigation links -->
    <frame src="navigation.html" name="topFrame" title="Navigation Frame">

    <!-- Bottom frame: Welcome message -->
    <frame src="welcome.html" name="bottomFrame" title="Content Frame">
</frameset>
</html>
