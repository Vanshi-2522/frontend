<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Iframes Example</title>
</head>
<body>
    <!-- Question: Two stacked iframes -->
    <h1>My Pages in Iframes</h1>

    <!-- First iframe: Introduction page -->
    <div style="width: 80%; height: 45%; margin: 20px auto;">
        <iframe 
            src="introduction.html" 
            title="Introduction Page" 
            width="100%" 
            height="100%" 
            style="border:1px solid #000;">
        </iframe>
    </div>

    <!-- Second iframe: Favorite hobby page -->
    <div style="width: 80%; height: 45%; margin: 20px auto;">
        <iframe 
            src="hobby.html" 
            title="Favorite Hobby Page" 
            width="100%" 
            height="100%" 
            style="border:1px solid #000;">
        </iframe>
    </div>

    <p>Both iframes are stacked vertically and adjust to the container size.</p>
</body>
</html>
