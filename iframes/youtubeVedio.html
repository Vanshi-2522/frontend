<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed YouTube Video</title>
</head>
<body>
    <!-- Question 1: Embed a YouTube Video -->
    <h1>Responsive YouTube Video</h1>
    
    <!-- Container div to set percentage width/height -->
    <div style="width: 80%; height: 50%; margin: 0 auto;">
        <iframe 
            width="100%" 
            height="100%" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <p>The video will resize when you adjust the browser window.</p>
</body>
</html>
