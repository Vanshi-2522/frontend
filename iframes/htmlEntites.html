<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities Example</title>
</head>
<body>
    <!-- Question 12: HTML Entities -->
    <h1>HTML Entities Example</h1>

    <p>
        Here are some common special characters using HTML entities: <br>
        &lt; &nbsp; (less than) <br>
        &gt; &nbsp; (greater than) <br>
        &amp; &nbsp; (ampersand) <br>
        &quot; &nbsp; (double quote) <br>
        &apos; &nbsp; (single quote) <br>
    </p>

    <p>
        Here are some common symbols: <br>
        &copy; &nbsp; (Copyright) <br>
        &trade; &nbsp; (Trademark) <br>
        &reg; &nbsp; (Registered) <br>
    </p>
</body>
</html>
