<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Security Example</title>
</head>
<body>
    <!-- Question 19: HTML Form Security -->
    <h1>Secure Form Example</h1>

    <!-- Form with autocomplete turned off -->
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <input type="submit" value="Submit">
    </form>

    <!-- Note explaining the security attribute -->
    <p>
        Note: Setting <code>autocomplete="off"</code> prevents browsers from automatically
        filling in saved usernames or passwords, which can improve security especially
        on public or shared computers.
    </p>
</body>
</html>
