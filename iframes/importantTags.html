<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 20: Important head elements -->

    <!-- Page title shown in browser tab -->
    <title>Important Head Elements Example</title>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Page description for search engines -->
    <meta name="description" content="This page demonstrates all important HTML head elements.">

    <!-- Author of the page -->
    <meta name="author" content="Your Name">

    <!-- Base URL for all relative links -->
    <base href="https://www.example.com/">

    <!-- Link to favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Internal CSS (can be empty) -->
    <style>
        /* Add your CSS here */
    </style>

    <!-- Internal JavaScript (can be empty) -->
    <script>
        // Add your JavaScript here
    </script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page includes title, meta tags, base, link, style, and script elements in the head section.</p>
</body>
</html>
