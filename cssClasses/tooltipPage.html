<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration</title>
  <style>
    /* ===== General Page Styling ===== */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      color: #2c3e50;
    }

    /* ===== Flexbox Container for Tooltip Examples ===== */
    .tooltip-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    /* ===== Tooltip Wrapper ===== */
    .tooltip {
      position: relative;
      display: inline-block;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2980b9;
    }

    /* ===== Tooltip Text ===== */
    .tooltip .tooltip-text {
      visibility: hidden;
      width: 160px;
      background-color: #2c3e50;
      color: #fff;
      text-align: center;
      border-radius: 5px;
      padding: 0.5rem;
      position: absolute;
      bottom: 125%; /* position tooltip above the element */
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      z-index: 1;
    }

    /* Small arrow below tooltip */
    .tooltip .tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%; /* Arrow points downward */
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #2c3e50 transparent transparent transparent;
    }

    /* ===== Hover State: Show Tooltip ===== */
    .tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: #777;
      font-size: 0.9rem;
    }

    /* ===== Responsive Design ===== */
    @media (max-width: 600px) {
      .tooltip-container {
        flex-direction: column;
        gap: 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CSS Tooltip Demonstration</h1>
    <p>Hover over the elements below to see the tooltips appear.</p>
  </header>

  <main>
    <section class="tooltip-container">
      <!-- Example 1: Word Tooltip -->
      <div class="tooltip">
        HTML
        <span class="tooltip-text">HyperText Markup Language</span>
      </div>

      <!-- Example 2: Word Tooltip -->
      <div class="tooltip">
        CSS
        <span class="tooltip-text">Cascading Style Sheets</span>
      </div>

      <!-- Example 3: Icon Tooltip -->
      <div class="tooltip">
        💡
        <span class="tooltip-text">A bright idea!</span>
      </div>

      <!-- Example 4: Icon Tooltip -->
      <div class="tooltip">
        📚
        <span class="tooltip-text">Study Time!</span>
      </div>
    </section>
  </main>

  <footer>
    <p>Created by Vanshika Gupta | Tooltip Demonstration Page</p>
  </footer>
</body>
</html>
