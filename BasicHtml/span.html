<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Inline</title>
</head>
<body>
    <p><span>Colours</span> hold a special place in our lives. Each colour carries its own emotion and meaning. For example, <span>red</span> symbolizes passion and intensity, while <span>blue</span> brings a sense of calm and depth. <span>Green</span> is associated with nature and new hope, whereas yellow represents happiness and energy.</p>
</body>
